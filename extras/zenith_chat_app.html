<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith — AI Financial Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#05080f; --bg2:#090d18; --bg3:#0d1322;
    --panel:#0c1220; --panel2:#111a2e; --panel3:#16213a;
    --card:#0f1728; --card2:#141f38;
    --line:rgba(56,80,136,.28); --line2:rgba(70,100,170,.4); --line3:rgba(90,125,205,.55);
    --txt:#eef3ff; --txt2:#c9d6f2; --mut:#8098c4; --dim:#586d94;
    --acc:#4f8cff; --acc2:#8b5cf6; --acc3:#22d3ee;
    --grn:#34d399; --red:#fb7185; --amb:#fbbf24;
    --grad:linear-gradient(135deg,#4f8cff 0%,#8b5cf6 100%);
    --grad2:linear-gradient(135deg,#22d3ee 0%,#4f8cff 55%,#8b5cf6 100%);
    --font:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono","Consolas",monospace;
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:14px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--line3);background-clip:content-box;border:1px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}
  ::selection{background:rgba(79,140,255,.4)}
  button,input,textarea{font-family:inherit}
  button{cursor:pointer}

  /* ============ ANIMATED DYNAMIC BACKGROUND ============
     Layered: hue-shifting aurora orbs + flowing wave ribbons (canvas)
     + drifting particles + masked grid. Every panel above it is
     translucent glass so the motion shows through the whole app. */
  #aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    animation:hueShift 46s linear infinite}
  @keyframes hueShift{from{filter:hue-rotate(0deg)}50%{filter:hue-rotate(28deg)}to{filter:hue-rotate(0deg)}}
  .orb{position:absolute;border-radius:50%;filter:blur(85px);opacity:.65;will-change:transform}
  .orb.o1{width:680px;height:680px;background:radial-gradient(circle,rgba(79,140,255,.4),transparent 64%);
    top:-260px;right:-160px;animation:drift1 24s ease-in-out infinite alternate}
  .orb.o2{width:620px;height:620px;background:radial-gradient(circle,rgba(139,92,246,.34),transparent 64%);
    bottom:-280px;left:-140px;animation:drift2 30s ease-in-out infinite alternate}
  .orb.o3{width:460px;height:460px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 64%);
    top:32%;left:36%;animation:drift3 36s ease-in-out infinite alternate}
  .orb.o4{width:380px;height:380px;background:radial-gradient(circle,rgba(236,72,153,.14),transparent 64%);
    top:8%;left:12%;animation:drift4 42s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(-120px,90px) scale(1.2)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(140px,-80px) scale(1.14)}}
  @keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,110px) scale(.9)}}
  @keyframes drift4{from{transform:translate(0,0)}to{transform:translate(-70px,120px)}}
  #waves{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8}
  #gridOverlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(70,100,170,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(70,100,170,.07) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 30%,#000 0%,transparent 100%);
    animation:gridDrift 24s linear infinite}
  @keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:46px 46px,46px 46px}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
    #waves{display:none}
  }

  /* ============ LOGIN ============ */
  #loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;
    overflow-y:auto;padding:32px 16px}
  .loginWrap{width:100%;max-width:452px;position:relative;z-index:1;animation:heroIn .7s var(--ease)}
  @keyframes heroIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
  .loginCard{position:relative;background:linear-gradient(180deg,rgba(20,31,56,.88),rgba(12,18,32,.94));
    border:1px solid var(--line2);border-radius:24px;padding:38px 36px 30px;
    box-shadow:0 50px 120px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(20px)}
  .loginCard::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(79,140,255,.5),transparent 30%,transparent 70%,rgba(139,92,246,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .brandMark{width:48px;height:48px;border-radius:15px;background:var(--grad);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:22px;color:#fff;flex-shrink:0;position:relative;
    box-shadow:0 10px 30px rgba(79,140,255,.45)}
  .brandMark::after{content:"";position:absolute;inset:-4px;border-radius:18px;border:1px solid rgba(79,140,255,.3);
    animation:ringPulse 2.6s ease-out infinite}
  @keyframes ringPulse{0%{transform:scale(.9);opacity:.8}70%,100%{transform:scale(1.25);opacity:0}}
  .brand h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
  .brand h1 span{background:var(--grad2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .loginSub{color:var(--mut);font-size:13.5px;margin-bottom:26px;line-height:1.55}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:10.5px;font-weight:700;color:var(--mut);margin-bottom:7px;
    letter-spacing:1px;text-transform:uppercase}
  .fld .inpWrap{position:relative}
  .fld input{width:100%;padding:13.5px 16px;background:rgba(9,13,24,.85);border:1px solid var(--line);border-radius:13px;
    color:var(--txt);font-size:14.5px;outline:none;transition:border-color .22s,box-shadow .22s,background .22s}
  .fld input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,140,255,.14);background:rgba(9,13,24,1)}
  .eyeBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);
    padding:7px;border-radius:9px;display:flex;transition:color .18s}
  .eyeBtn:hover{color:var(--txt)}
  .eyeBtn svg{width:17px;height:17px}
  .envRow{display:flex;gap:9px;margin-bottom:20px}
  .envBtn{flex:1;padding:10px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(9,13,24,.7);
    color:var(--mut);font-size:12.2px;font-weight:650;transition:all .2s var(--ease);text-align:center;position:relative;overflow:hidden}
  .envBtn.active{border-color:var(--acc);color:#fff;background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(139,92,246,.14));
    box-shadow:0 0 0 3px rgba(79,140,255,.1)}
  .envBtn small{display:block;font-weight:450;color:var(--dim);font-size:10.4px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
  .envBtn.active small{color:var(--mut)}
  .primaryBtn{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;font-weight:750;
    background:var(--grad);color:#fff;letter-spacing:.2px;position:relative;overflow:hidden;
    transition:transform .14s var(--ease),box-shadow .25s;box-shadow:0 12px 34px rgba(79,140,255,.4)}
  .primaryBtn::after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;transform:skewX(-22deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transition:left .5s}
  .primaryBtn:hover::after{left:130%}
  .primaryBtn:hover{box-shadow:0 16px 46px rgba(79,140,255,.55)}
  .primaryBtn:active{transform:scale(.98)}
  .primaryBtn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
  .loginErr{display:none;margin-top:14px;padding:11px 15px;border-radius:11px;font-size:13px;text-align:center;
    background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.4);color:var(--red);animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .demoBlock{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  .demoBlock .dbTitle{font-size:10.5px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--dim);
    margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .demoBlock .dbTitle svg{width:13px;height:13px;color:var(--acc3)}
  .demoMails{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
  .demoMail{font-size:11.6px;padding:6.5px 12px;border-radius:99px;background:rgba(9,13,24,.75);border:1px solid var(--line);
    color:var(--txt2);transition:all .18s var(--ease);font-family:var(--mono);cursor:pointer}
  .demoMail:hover{border-color:var(--acc);color:#fff;background:rgba(79,140,255,.14);transform:translateY(-1.5px)}
  .demoPass{font-size:12px;color:var(--dim);line-height:1.9}
  .demoPass code{font-family:var(--mono);font-size:11.4px;color:var(--txt2);background:rgba(9,13,24,.75);
    border:1px solid var(--line);padding:2.5px 8px;border-radius:8px;cursor:pointer;transition:all .18s}
  .demoPass code:hover{border-color:var(--acc);color:#fff;transform:translateY(-1px)}

  /* ============ APP SHELL ============ */
  #appView{display:none;height:100%;width:100%;position:relative;z-index:1}
  #appView.on{display:flex;animation:appIn .5s var(--ease)}
  @keyframes appIn{from{opacity:0}to{opacity:1}}

  /* ---------- SIDEBAR ---------- */
  #sidebar{width:296px;flex-shrink:0;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(11,16,29,.6),rgba(7,11,20,.68));
    backdrop-filter:blur(26px) saturate(1.3);border-right:1px solid var(--line);
    transition:margin-left .32s var(--ease)}
  #sidebar.hidden{margin-left:-296px}
  .sbHead{padding:17px 16px 12px;display:flex;align-items:center;gap:11px}
  .sbHead .brandMark{width:37px;height:37px;font-size:16px;border-radius:11px}
  .sbHead .brandMark::after{display:none}
  .sbHead .t{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
  .sbHead .t span{background:var(--grad2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .newChatBtn{margin:4px 15px 13px;padding:12px 15px;border-radius:13px;border:1px solid var(--line2);
    background:linear-gradient(135deg,rgba(79,140,255,.15),rgba(139,92,246,.13));color:var(--txt);
    font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:10px;transition:all .2s var(--ease);
    position:relative;overflow:hidden}
  .newChatBtn:hover{border-color:var(--acc);transform:translateY(-1px);
    box-shadow:0 8px 22px rgba(79,140,255,.22)}
  .newChatBtn:active{transform:none}
  .newChatBtn svg{width:15px;height:15px;flex-shrink:0;transition:transform .3s var(--ease)}
  .newChatBtn:hover svg{transform:rotate(90deg)}
  .sbLabel{padding:4px 20px 9px;font-size:10.2px;font-weight:750;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;justify-content:space-between}
  .sbRefresh{background:none;border:none;color:var(--dim);padding:4px;border-radius:7px;display:flex;transition:color .18s}
  .sbRefresh:hover{color:var(--txt)}
  .sbRefresh svg{width:12.5px;height:12.5px}
  .sbRefresh.spin svg{animation:spin .7s linear infinite}
  #threadList{flex:1;overflow-y:auto;padding:0 10px 16px}
  .threadItem{padding:11px 13px;border-radius:12px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;
    transition:background .16s,border-color .16s,transform .16s;position:relative;animation:slideIn .35s var(--ease) backwards}
  @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .threadItem:hover{background:rgba(22,33,58,.55);transform:translateX(2px)}
  .threadItem.active{background:rgba(22,33,58,.6);border-color:var(--line2);backdrop-filter:blur(8px)}
  .threadItem.active::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;
    background:var(--grad);box-shadow:0 0 12px rgba(79,140,255,.6)}
  .threadItem .tt{font-size:13px;font-weight:560;color:var(--txt2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-bottom:3px}
  .threadItem.active .tt{color:#fff}
  .threadItem .td{font-size:10.8px;color:var(--dim);font-family:var(--mono)}
  .sbEmpty{padding:28px 18px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7}
  .skel{height:52px;border-radius:12px;margin-bottom:6px;
    background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);
    background-size:200% 100%;animation:shimmer 1.3s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .sbFoot{padding:13px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--grn),var(--acc));
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#04101f;flex-shrink:0}
  .sbUser{flex:1;min-width:0}
  .sbUser .n{font-size:13px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbUser .e{font-size:10.8px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
  .logoutBtn{background:none;border:1px solid var(--line);color:var(--mut);padding:9px;border-radius:10px;
    display:flex;transition:all .18s;flex-shrink:0}
  .logoutBtn:hover{color:var(--red);border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.07)}
  .logoutBtn svg{width:15px;height:15px}

  /* ---------- MAIN ---------- */
  #main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;position:relative}
  .mainHead{display:flex;align-items:center;gap:13px;padding:13px 22px;border-bottom:1px solid var(--line);
    background:rgba(5,8,15,.42);backdrop-filter:blur(24px) saturate(1.3);z-index:5}
  .burger{background:none;border:1px solid var(--line);color:var(--mut);padding:9px;border-radius:11px;
    display:flex;transition:all .18s}
  .burger:hover{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
  .burger svg{width:16px;height:16px}
  .headTitleWrap{flex:1;min-width:0}
  .headTitle{font-size:15px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.15px}
  .headSub{font-size:11.3px;color:var(--dim);display:flex;align-items:center;gap:7px;margin-top:2px}
  .headSub .sdot{width:7px;height:7px;border-radius:50%;background:var(--grn);flex-shrink:0;position:relative}
  .headSub .sdot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--grn);
    animation:ringPulse 2s ease-out infinite}
  .headSub .sdot.busy{background:var(--amb)}
  .headSub .sdot.busy::after{border-color:var(--amb)}
  .envPill{font-size:10.2px;font-weight:750;letter-spacing:.8px;padding:6px 13px;border-radius:99px;
    background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.32);color:var(--acc3);
    white-space:nowrap;font-family:var(--mono)}

  /* ---------- SCROLL AREA ---------- */
  #scroller{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative}
  #feed{max-width:840px;margin:0 auto;padding:30px 26px 44px;display:flex;flex-direction:column;gap:20px}
  #jumpDown{position:absolute;left:50%;transform:translateX(-50%) translateY(14px);bottom:18px;z-index:8;
    display:flex;align-items:center;gap:7px;padding:9px 17px;border-radius:99px;border:1px solid var(--line2);
    background:rgba(17,26,46,.92);backdrop-filter:blur(10px);color:var(--txt2);font-size:12px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);
    box-shadow:0 12px 34px rgba(0,0,0,.5)}
  #jumpDown.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  #jumpDown:hover{border-color:var(--acc);color:#fff}
  #jumpDown svg{width:13px;height:13px}

  /* ---------- WELCOME ---------- */
  #welcome{max-width:660px;margin:auto;text-align:center;padding:44px 24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58vh}
  .wMark{width:72px;height:72px;border-radius:22px;background:var(--grad);display:flex;align-items:center;
    justify-content:center;font-size:31px;font-weight:800;color:#fff;margin-bottom:24px;position:relative;
    box-shadow:0 20px 56px rgba(79,140,255,.45);animation:floatY 5s ease-in-out infinite}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .wMark::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:1px solid rgba(79,140,255,.35);
    animation:ringPulse 2.8s ease-out infinite}
  #welcome h2{font-size:29px;font-weight:800;letter-spacing:-.7px;margin-bottom:11px;animation:fadeUp .55s var(--ease) .08s backwards}
  #welcome h2 em{font-style:normal;background:var(--grad2);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
  #welcome p{font-size:14px;color:var(--mut);line-height:1.7;margin-bottom:32px;animation:fadeUp .55s var(--ease) .16s backwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .starterGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  @media(max-width:640px){.starterGrid{grid-template-columns:1fr}}
  .starter{padding:16px 18px;border-radius:16px;border:1px solid rgba(70,100,170,.32);
    background:linear-gradient(135deg,rgba(19,29,52,.42),rgba(13,20,36,.34));
    text-align:left;transition:all .22s var(--ease);color:var(--txt2);position:relative;overflow:hidden;
    animation:fadeUp .55s var(--ease) backwards;backdrop-filter:blur(16px) saturate(1.2)}
  .starter:nth-child(1){animation-delay:.22s}.starter:nth-child(2){animation-delay:.3s}
  .starter:nth-child(3){animation-delay:.38s}.starter:nth-child(4){animation-delay:.46s}
  .starter::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s;
    background:linear-gradient(135deg,rgba(79,140,255,.1),rgba(139,92,246,.07))}
  .starter:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
  .starter:hover::before{opacity:1}
  .starter .st{font-size:13.3px;font-weight:680;color:var(--txt);margin-bottom:5px;display:flex;align-items:center;gap:9px;position:relative}
  .starter .st svg{width:15px;height:15px;color:var(--acc);flex-shrink:0}
  .starter .ss{font-size:12px;color:var(--dim);line-height:1.5;position:relative}

  /* ---------- MESSAGES ---------- */
  .turn{display:flex;gap:14px;animation:msgIn .35s var(--ease)}
  @keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
  .turn.user{flex-direction:row-reverse}
  .mAvatar{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:750;margin-top:2px;position:relative}
  .turn.bot .mAvatar{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(79,140,255,.4)}
  .turn.user .mAvatar{background:linear-gradient(135deg,var(--grn),var(--acc));color:#04101f}
  .bubbleWrap{max-width:calc(100% - 52px);min-width:0;display:flex;flex-direction:column;gap:12px;position:relative}
  .turn.user .bubbleWrap{align-items:flex-end}
  .bubble{padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.7;
    overflow-wrap:anywhere;word-break:break-word;position:relative}
  .turn.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:7px;font-weight:480;
    box-shadow:0 8px 26px rgba(79,140,255,.28);white-space:pre-wrap}
  .turn.bot .bubble{background:linear-gradient(180deg,rgba(19,29,52,.5),rgba(13,20,36,.55));
    border:1px solid rgba(70,100,170,.32);border-bottom-left-radius:7px;
    width:100%;backdrop-filter:blur(18px) saturate(1.25);
    box-shadow:0 10px 34px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04)}
  .copyMsg{position:absolute;top:-11px;right:12px;display:flex;align-items:center;gap:5px;font-size:10.5px;
    font-weight:650;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--dim);opacity:0;transition:opacity .2s,color .2s}
  .turn.bot:hover .copyMsg{opacity:1}
  .copyMsg:hover{color:var(--txt)}
  .copyMsg svg{width:11px;height:11px}

  /* typing indicator */
  .typing{display:inline-flex;align-items:center;gap:5px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:tbounce 1.2s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.18s;background:var(--acc2)}
  .typing i:nth-child(3){animation-delay:.36s;background:var(--acc3)}
  @keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-6px);opacity:1}}

  /* markdown inside bot bubble */
  .bubble .cursor{display:inline-block;width:8px;height:15px;background:var(--acc);border-radius:2px;
    vertical-align:-2px;margin-left:2px;animation:blink .85s step-end infinite;
    box-shadow:0 0 10px rgba(79,140,255,.8)}
  @keyframes blink{50%{opacity:0}}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{color:#fff;margin:15px 0 8px;line-height:1.35;font-weight:720;letter-spacing:-.2px}
  .bubble h1{font-size:17.5px}.bubble h2{font-size:16.5px}.bubble h3{font-size:15px}.bubble h4{font-size:14px}
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child{margin-top:0}
  .bubble p{margin:0 0 10px}
  .bubble p:last-child{margin-bottom:0}
  .bubble strong{color:#fff;font-weight:700}
  .bubble em{color:var(--txt2)}
  .bubble del{color:var(--dim)}
  .bubble a{color:var(--acc3);text-decoration:none;border-bottom:1px dotted rgba(34,211,238,.5);transition:border-color .15s}
  .bubble a:hover{border-bottom-style:solid}
  .bubble ul,.bubble ol{margin:8px 0 11px 22px}
  .bubble li{margin-bottom:5px}
  .bubble li::marker{color:var(--acc)}
  .bubble li:last-child{margin-bottom:0}
  .bubble hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .bubble blockquote{border-left:3px solid var(--acc);padding:7px 15px;margin:10px 0;background:rgba(79,140,255,.06);
    border-radius:0 10px 10px 0;color:var(--txt2)}
  .bubble code{font-family:var(--mono);font-size:12.2px;background:rgba(9,13,24,.9);border:1px solid var(--line);
    padding:2px 7px;border-radius:7px;color:var(--acc3)}
  .codeBlock{position:relative;margin:10px 0}
  .codeBlock pre{background:rgba(9,13,24,.92);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    overflow-x:auto}
  .codeBlock pre code{background:none;border:none;padding:0;color:var(--txt2);font-size:12.2px;line-height:1.65}
  .codeCopy{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:5px;font-size:10.4px;
    font-weight:650;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--dim);opacity:0;transition:all .2s}
  .codeBlock:hover .codeCopy{opacity:1}
  .codeCopy:hover{color:var(--txt);border-color:var(--acc)}
  .codeCopy svg{width:11px;height:11px}
  .tblWrap{overflow-x:auto;margin:11px 0;border-radius:12px;border:1px solid var(--line2);background:rgba(9,13,24,.7)}
  .bubble table{width:100%;border-collapse:collapse;font-size:12.4px;min-width:100%}
  .bubble th{background:var(--panel2);color:var(--txt2);font-weight:700;text-align:left;padding:10px 14px;
    border-bottom:1px solid var(--line2);white-space:nowrap;font-size:11.2px;text-transform:uppercase;letter-spacing:.5px;
    position:sticky;top:0}
  .bubble td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bubble tr:last-child td{border-bottom:none}
  .bubble tbody tr{transition:background .14s}
  .bubble tbody tr:hover td{background:rgba(79,140,255,.05)}

  /* ---------- CHART CARD ---------- */
  .chartCard{width:100%;background:linear-gradient(180deg,rgba(20,31,56,.48),rgba(13,20,36,.6));
    border:1px solid var(--line2);border-radius:18px;padding:17px 19px 13px;animation:msgIn .4s var(--ease);
    backdrop-filter:blur(20px) saturate(1.25);
    box-shadow:0 14px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05)}
  .chartTop{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .chartTitles{flex:1;min-width:0}
  .chartCard .ct{font-size:13.4px;font-weight:720;color:var(--txt);display:flex;align-items:center;gap:9px;letter-spacing:-.1px}
  .chartCard .ct .cIco{width:26px;height:26px;border-radius:8px;background:rgba(79,140,255,.14);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chartCard .ct svg{width:13px;height:13px;color:var(--acc)}
  .chartCard .cs{font-size:10.8px;color:var(--dim);margin-top:4px;font-family:var(--mono)}
  .chartTools{display:flex;gap:6px;flex-shrink:0;align-items:center}
  .cSeg{display:flex;background:rgba(9,13,24,.8);border:1px solid var(--line);border-radius:9px;padding:2.5px}
  .cSegBtn{padding:5px 11px;border:none;background:none;border-radius:7px;color:var(--dim);font-size:10.8px;
    font-weight:700;letter-spacing:.4px;transition:all .18s}
  .cSegBtn.active{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(79,140,255,.35)}
  .cTool{background:rgba(9,13,24,.8);border:1px solid var(--line);color:var(--dim);padding:7px;border-radius:9px;
    display:flex;transition:all .18s}
  .cTool:hover{color:var(--txt);border-color:var(--acc)}
  .cTool svg{width:13px;height:13px}
  .chartBox{position:relative;width:100%;height:310px}
  @media(max-width:640px){.chartBox{height:240px}}
  .chartFoot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 2px 2px;border-top:1px solid var(--line);margin-top:10px}
  .cStat{font-size:10.8px;color:var(--dim);font-family:var(--mono)}
  .cStat b{color:var(--txt2);font-weight:600}
  .cStat.up b{color:var(--grn)} .cStat.down b{color:var(--red)}

  /* ---------- STATUS ---------- */
  .statusRow{display:flex;gap:14px;animation:msgIn .3s var(--ease)}
  .statusPill{display:flex;align-items:center;gap:11px;font-size:12.6px;color:var(--txt2);padding:10px 18px;
    border-radius:99px;max-width:100%;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(79,140,255,.12),rgba(139,92,246,.09));
    border:1px solid rgba(79,140,255,.32);backdrop-filter:blur(14px) saturate(1.2)}
  .statusPill::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(120,160,255,.09),transparent);animation:sweep 1.8s linear infinite}
  @keyframes sweep{to{left:130%}}
  .statusPill .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
  .orbit{width:16px;height:16px;flex-shrink:0;position:relative}
  .orbit::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(79,140,255,.22)}
  .orbit::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;
    border-top-color:var(--acc);border-right-color:var(--acc2);animation:spin .65s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .sysNote{align-self:center;font-size:11.4px;color:var(--dim);background:rgba(9,13,24,.8);border:1px solid var(--line);
    padding:7px 16px;border-radius:99px;text-align:center;animation:msgIn .3s var(--ease);backdrop-filter:blur(6px)}
  .sysNote.warn{color:var(--amb);border-color:rgba(251,191,36,.4)}
  .sysNote.err{color:var(--red);border-color:rgba(251,113,133,.4)}

  /* ---------- COMPOSER ---------- */
  /* Floating composer: no full-width band, no border strip — just the
     chips and the input itself, hugging their own content. */
  #composerZone{background:transparent;z-index:5}
  /* Suggestions: a VERTICAL stack of translucent glass rows above the
     composer, each sliding in with a stagger. */
  #chipsRow{display:flex;flex-direction:column;gap:7px;padding:0 26px 9px;max-width:840px;margin:0 auto}
  #chipsRow:empty{padding:0}
  .chip{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-size:12.8px;
    padding:11px 17px;border-radius:14px;color:var(--txt2);position:relative;overflow:hidden;
    background:linear-gradient(90deg,rgba(19,29,52,.42),rgba(15,23,40,.32));
    border:1px solid rgba(70,100,170,.32);backdrop-filter:blur(16px) saturate(1.2);
    transition:all .22s var(--ease);animation:chipIn .45s var(--ease) backwards}
  @keyframes chipIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  .chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
    background:var(--grad);opacity:0;transition:opacity .22s}
  .chip::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(120,160,255,.07),transparent);transition:left .5s}
  .chip:hover{border-color:rgba(79,140,255,.6);color:#fff;transform:translateX(5px);
    background:linear-gradient(90deg,rgba(79,140,255,.16),rgba(139,92,246,.09));
    box-shadow:0 10px 28px rgba(79,140,255,.16)}
  .chip:hover::before{opacity:1}
  .chip:hover::after{left:130%}
  .chip svg{width:12px;height:12px;color:var(--acc);flex-shrink:0;transition:transform .22s var(--ease)}
  .chip:hover svg{transform:translate(2px,-2px)}
  .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .composerWrap{max-width:840px;margin:0 auto;padding:0 26px 12px}
  .composer{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line2);
    background:linear-gradient(180deg,rgba(19,29,52,.62),rgba(13,20,36,.7));
    backdrop-filter:blur(22px) saturate(1.25);
    border-radius:20px;padding:9px 9px 9px 19px;transition:border-color .22s,box-shadow .28s;position:relative;
    box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
  .composer:focus-within{border-color:var(--acc);
    box-shadow:0 0 0 4px rgba(79,140,255,.13),0 18px 44px rgba(0,0,0,.4),0 0 40px rgba(79,140,255,.07)}
  .composer textarea{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14.3px;
    line-height:1.55;resize:none;max-height:140px;padding:9px 0}
  .composer textarea::placeholder{color:var(--dim)}
  .sendBtn{width:44px;height:44px;border-radius:14px;border:none;flex-shrink:0;background:var(--grad);
    display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),box-shadow .25s,opacity .2s;
    box-shadow:0 8px 22px rgba(79,140,255,.4)}
  .sendBtn:hover:not(:disabled){transform:scale(1.07) rotate(-4deg);box-shadow:0 10px 30px rgba(79,140,255,.55)}
  .sendBtn:active:not(:disabled){transform:scale(.93)}
  .sendBtn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .sendBtn svg{width:18px;height:18px;fill:#fff}

  /* ---------- TOAST ---------- */
  #toastZone{position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:9px}
  .toast{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:13px;font-size:13px;
    background:rgba(20,31,56,.95);border:1px solid var(--line2);color:var(--txt2);backdrop-filter:blur(12px);
    box-shadow:0 20px 54px rgba(0,0,0,.6);animation:toastIn .35s var(--ease);max-width:380px}
  .toast svg{width:15px;height:15px;flex-shrink:0}
  .toast.err{border-color:rgba(251,113,133,.55);color:var(--red)}
  .toast.ok{border-color:rgba(52,211,153,.55);color:var(--grn)}
  @keyframes toastIn{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}

  /* ---------- MOBILE ---------- */
  #sbScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:39;backdrop-filter:blur(3px);
    animation:appIn .25s}
  @media(max-width:880px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;box-shadow:24px 0 70px rgba(0,0,0,.55)}
    #sidebar.hidden{margin-left:-300px;box-shadow:none}
    #sidebar:not(.hidden) ~ #sbScrim{display:block}
    #feed{padding:20px 15px 34px}
    .composerWrap{padding:0 15px 10px}
    #chipsRow{padding:0 15px 8px}
    .bubbleWrap{max-width:calc(100% - 48px)}
  }
</style>
</head>
<body>

<script>
"use strict";
/* =====================================================================
   CONFIG
===================================================================== */
const ENVIRONMENTS = {
  local: { label: "LOCAL", zenith: "http://127.0.0.1:8888/api/zenithv2/zenith-chat" },

};
const USER_API = "https://development.unboundxinc.us/api/user-service";

   account's ONE shared default live-context bucket, which is not
   guaranteed empty (proven live while building the earlier MVP). */

  "raj@yopmail.com", "hella@yopmail.com", "helo@yopmail.com", "milan@yopmail.com",

];

const STARTERS = [
  { t: "Market snapshot",  q: "How are the major US indices doing right now?", s: "Live index levels with today's moves" },
  { t: "Company research", q: "Give me a quick overview of NVIDIA — price, valuation and recent analyst actions", s: "Quote, ratios and street sentiment" },
  { t: "Compare stocks",   q: "Compare Apple and Microsoft performance over the last year", s: "Overlay chart of both names, indexed" },
  { t: "Price history",    q: "Show me Tesla's price history for the last 6 months", s: "Full OHLC candles and trend" },
];

/* =====================================================================
   STATE
===================================================================== */
let ENV = localStorage.getItem("zenithEnv") || "local";
let TOKEN = null;
let USER = {};
let THREAD_ID = null;

let FIRST_QUESTION = "";
let SENDING = false;

let chartSeq = 0;
const CHART_REGISTRY = new Map();   // cardId -> { spec, chart, mode }

const $ = id => document.getElementById(id);
const zenithBase = () => ENVIRONMENTS[ENV].zenith;

/* =====================================================================
   SMALL UTILITIES
===================================================================== */
const ICONS = {
  ok:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.innerHTML = (kind === "ok" ? ICONS.ok : kind === "err" ? ICONS.err : "") + `<span>${escapeHtml(msg)}</span>`;
  $("toastZone").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; }, 3600);
  setTimeout(() => t.remove(), 4100);
}

function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "d ago";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function escapeHtml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function autoGrow(el) {

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      const prev = btn.innerHTML;
      btn.innerHTML = ICONS.ok + "<span>Copied</span>";
      setTimeout(() => { btn.innerHTML = prev; }, 1400);

}

/* =====================================================================
   MARKDOWN — full renderer for Zenith's answers:
   headings, bold/italic/strikethrough, inline + fenced code (with copy),
   links, tables, ordered/unordered lists, blockquotes, hr, paragraphs.
===================================================================== */
function renderMarkdown(src) {
  if (!src) return "";
  const codeBlocks = [];
  let text = String(src).replace(/```([\s\S]*?)```/g, (m, body) => {
    codeBlocks.push(body.replace(/^[a-zA-Z0-9_-]*\n/, ""));
    return "\u0000CODE" + (codeBlocks.length - 1) + "\u0000";
  });

  text = escapeHtml(text);

  // markdown tables (| head | ... with |---| separator)
  text = text.replace(/(^|\n)((?:\|[^\n]*\|[ \t]*\n)+)/g, (m, lead, block) => {
    const lines = block.trim().split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length < 2 || !/^\|[\s:|-]+\|$/.test(lines[1])) return m;
    const cells = row => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const head = cells(lines[0]).map(c => `<th>${inline(c)}</th>`).join("");
    const body = lines.slice(2).map(r =>
      "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("");
    return `${lead}<div class="tblWrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>\n`;
  });

  function inline(s) {
    return s
      .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g, "$1<em>$2</em>")
      .replace(/~~(.+?)~~/g, "<del>$1</del>")
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  }

  const out = [];
  const lines = text.split("\n");
  let list = null, para = [];

  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => {
    if (list) {
      const start = list.type === "ol" && list.start > 1 ? ` start="${list.start}"` : "";
      out.push(`<${list.type}${start}>` + list.items.map(i => `<li>${inline(i)}</li>`).join("") + `</${list.type}>`);
      list = null;
    }
  };

  for (let li = 0; li < lines.length; li++) {
    const t = lines[li].replace(/\s+$/, "").trim();
    if (!t) {
      flushPara();
      // A blank line between items must NOT split the list: LLMs space out
      // their bullets, and separate <ol>s each restart at "1." — merging
      // them lets the browser number the items 1, 2, 3 correctly.
      if (list) {
        let j = li + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        const nxt = j < lines.length ? lines[j].trim() : "";
        const continues = list.type === "ol"
          ? /^\d{1,3}[.)]\s+/.test(nxt)
          : /^[-*+]\s+/.test(nxt);
        if (!continues) flushList();
      }
      continue;
    }

    if (t.startsWith("\u0000CODE")) {
      flushPara(); flushList();
      const idx = parseInt(t.replace(/\u0000/g, "").slice(4), 10);
      const code = codeBlocks[idx] ?? "";
      out.push(
        `<div class="codeBlock"><pre><code>${escapeHtml(code)}</code></pre>` +
        `<button class="codeCopy" onclick="copyCode(this)">${ICONS.copy}<span>Copy</span></button></div>`);
      continue;
    }
    if (t.startsWith("<div class=\"tblWrap\"")) { flushPara(); flushList(); out.push(t); continue; }

    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); flushList(); out.push("<hr>"); continue; }

    const bq = t.match(/^&gt;\s?(.*)$/);
    if (bq) { flushPara(); flushList(); out.push(`<blockquote>${inline(bq[1])}</blockquote>`); continue; }

    const ol = t.match(/^(\d{1,3})[.)]\s+(.*)$/);
    if (ol) {
      flushPara();
      if (!list || list.type !== "ol") { flushList(); list = { type: "ol", start: parseInt(ol[1], 10) || 1, items: [] }; }
      list.items.push(ol[2]); continue;
    }
    const ul = t.match(/^[-*+]\s+(.*)$/);
    if (ul) { flushPara(); if (!list || list.type !== "ul") { flushList(); list = { type: "ul", items: [] }; } list.items.push(ul[1]); continue; }

    para.push(t);
  }
  flushPara(); flushList();
  return out.join("\n");
}

function copyCode(btn) {
  const pre = btn.parentElement.querySelector("pre code");
  copyText(pre ? pre.textContent : "", btn);
}

/* =====================================================================
   CHART ENGINE
   Renders every spec shape the backend emits on chunk_type "chart":
     { chart_type: "line"|"bar", title, x_label, y_label, percentage?,
       labels[], datasets:[{label, data[], color, ohlc?:{open,high,low,close}}] }
   - line: gradient area (single) or multi-line overlay (comparison)
   - bar: grouped bars, per-dataset colors, null gaps preserved
   - ohlc: full candlestick view (native floating bars: wick + body,
     green/red by direction) with a LINE / CANDLES toggle
   - percentage mode, T/B/M axis formatting, PNG export, footer stats
===================================================================== */
const PALETTE = ["#4f8cff", "#8b5cf6", "#22d3ee", "#34d399", "#fbbf24", "#fb7185", "#a3e635", "#f472b6"];

function hexToRgba(hex, a) {
  const h = (hex || "#4f8cff").replace("#", "");
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function fmtNum(v, pct) {
  if (v === null || v === undefined || isNaN(v)) return "";
  const n = Number(v);
  if (pct) return n.toFixed(2) + "%";
  const a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + "T";
  if (a >= 1e9)  return (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6)  return (n / 1e6).toFixed(2) + "M";
  if (a >= 1e3)  return n.toLocaleString("en-US", { maximumFractionDigits: 1 });
  return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
}

function specHasOhlc(spec) {
  return spec.datasets.length === 1 && spec.datasets[0].ohlc &&
    Array.isArray(spec.datasets[0].ohlc.open) && spec.datasets[0].ohlc.open.length > 1;
}

function renderChartCard(spec, container) {
  if (!spec || !Array.isArray(spec.labels) || !Array.isArray(spec.datasets) || !spec.datasets.length) return;
  const cardId = "zc" + (++chartSeq);
  const hasOhlc = specHasOhlc(spec);

  const card = document.createElement("div");
  card.className = "chartCard";
  card.id = cardId;
  card.innerHTML = `
    <div class="chartTop">
      <div class="chartTitles">
        <div class="ct"><span class="cIco">${ICONS.chart}</span>${escapeHtml(spec.title || "Chart")}</div>
        <div class="cs">${escapeHtml(spec.x_label || "")}${spec.x_label && spec.y_label ? " / " : ""}${escapeHtml(spec.y_label || "")}${spec.percentage ? " (indexed %)" : ""}</div>
      </div>
      <div class="chartTools">
        ${hasOhlc ? `
        <div class="cSeg">
          <button class="cSegBtn active" onclick="setChartMode('${cardId}','line',this)">LINE</button>
          <button class="cSegBtn" onclick="setChartMode('${cardId}','candle',this)">CANDLES</button>
        </div>` : ""}
        <button class="cTool" title="Download as PNG" onclick="downloadChart('${cardId}')">${ICONS.down}</button>
      </div>
    </div>
    <div class="chartBox"><canvas></canvas></div>
    <div class="chartFoot">${chartFooter(spec)}</div>`;
  container.appendChild(card);

  CHART_REGISTRY.set(cardId, { spec, chart: null, mode: "line" });
  buildChart(cardId);
}

function chartFooter(spec) {
  const d = spec.datasets[0];
  const vals = (d.data || []).filter(v => v !== null && v !== undefined && !isNaN(v)).map(Number);
  if (!vals.length) return "";
  const pct = !!spec.percentage;
  const first = vals[0], last = vals[vals.length - 1];
  const min = Math.min(...vals), max = Math.max(...vals);
  const chg = first ? ((last - first) / Math.abs(first)) * 100 : 0;
  const dirCls = last >= first ? "up" : "down";
  const stats = [
    `<span class="cStat">LOW <b>${fmtNum(min, pct)}</b></span>`,
    `<span class="cStat">HIGH <b>${fmtNum(max, pct)}</b></span>`,
    `<span class="cStat">LAST <b>${fmtNum(last, pct)}</b></span>`,
  ];
  if (!pct && vals.length > 2) {
    stats.push(`<span class="cStat ${dirCls}">PERIOD <b>${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</b></span>`);
  }
  return stats.join("");
}

function setChartMode(cardId, mode, btn) {
  const reg = CHART_REGISTRY.get(cardId);
  if (!reg || reg.mode === mode) return;
  reg.mode = mode;
  btn.parentElement.querySelectorAll(".cSegBtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  buildChart(cardId);
}

function downloadChart(cardId) {
  const reg = CHART_REGISTRY.get(cardId);
  if (!reg || !reg.chart) return;
  const a = document.createElement("a");
  a.download = (reg.spec.title || "zenith-chart").replace(/[^\w ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".png";
  a.href = reg.chart.toBase64Image("image/png", 1);
  a.click();
}

function baseScales(pct) {
  return {
    x: { grid: { color: "rgba(56,80,136,.22)" },
         ticks: { color: "#586d94", maxTicksLimit: 9, maxRotation: 0, font: { size: 10.5, family: "Inter" } } },
    y: { grid: { color: "rgba(56,80,136,.22)" },
         ticks: { color: "#586d94", maxTicksLimit: 7, font: { size: 10.5, family: "Inter" },
                  callback: v => fmtNum(v, pct) } },
  };
}
function baseTooltip(pct, extraCb) {
  return {
    backgroundColor: "rgba(20,31,56,.97)", borderColor: "rgba(70,100,170,.5)", borderWidth: 1,
    titleColor: "#eef3ff", bodyColor: "#c9d6f2", padding: 12, cornerRadius: 11,
    titleFont: { size: 12, family: "Inter", weight: "600" }, bodyFont: { size: 12, family: "Inter" },
    displayColors: true, boxWidth: 9, boxHeight: 9, boxPadding: 3, usePointStyle: true,
    callbacks: extraCb || { label: c => ` ${c.dataset.label}: ${fmtNum(c.parsed.y, pct)}` },
  };
}

function buildChart(cardId) {
  const reg = CHART_REGISTRY.get(cardId);
  if (!reg) return;
  if (reg.chart) { reg.chart.destroy(); reg.chart = null; }
  const canvas = document.getElementById(cardId).querySelector("canvas");
  const spec = reg.spec;
  const pct = !!spec.percentage;

  if (reg.mode === "candle" && specHasOhlc(spec)) {
    reg.chart = buildCandleChart(canvas, spec);
    return;
  }

  const isLine = (spec.chart_type || "line") === "line";
  const single = spec.datasets.length === 1;

  const datasets = spec.datasets.map((d, i) => {
    const color = d.color || PALETTE[i % PALETTE.length];
    return {
      label: d.label || `Series ${i + 1}`,
      data: (d.data || []).map(v => (v === null || v === undefined ? null : Number(v))),
      borderColor: color,
      backgroundColor: isLine
        ? (single ? areaGradient(color) : hexToRgba(color, .12))
        : hexToRgba(color, .82),
      borderWidth: isLine ? 2.3 : 0,
      pointRadius: 0, pointHoverRadius: 4.5,
      pointHoverBackgroundColor: color, pointHoverBorderColor: "#fff", pointHoverBorderWidth: 1.5,
      tension: .3, fill: isLine && single,
      borderRadius: isLine ? 0 : 6, maxBarThickness: 36, spanGaps: true,
    };
  });

  function areaGradient(color) {
    return (ctx) => {
      const { chart } = ctx;
      const { ctx: c, chartArea } = chart;
      if (!chartArea) return hexToRgba(color, .1);
      const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
      g.addColorStop(0, hexToRgba(color, .32));
      g.addColorStop(1, hexToRgba(color, .01));
      return g;
    };
  }

  reg.chart = new Chart(canvas, {
    type: isLine ? "line" : "bar",
    data: { labels: spec.labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 650, easing: "easeOutQuart" },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          display: spec.datasets.length > 1,
          labels: { color: "#c9d6f2", boxWidth: 12, boxHeight: 12, borderRadius: 3,
                    usePointStyle: true, pointStyle: "rectRounded", font: { size: 11.5, family: "Inter" } },
        },
        tooltip: baseTooltip(pct),
      },
      scales: baseScales(pct),
    },
  });
}

/* Candlestick view — built natively from the spec's ohlc arrays using
   floating bars: a thin high-low "wick" dataset under a thicker
   open-close "body" dataset, green when close >= open, red otherwise. */
function buildCandleChart(canvas, spec) {
  const d = spec.datasets[0];
  const o = d.ohlc.open.map(Number), h = d.ohlc.high.map(Number),
        l = d.ohlc.low.map(Number),  c = d.ohlc.close.map(Number);
  const up = c.map((v, i) => v >= o[i]);
  const GRN = "#34d399", RED = "#fb7185";

  const wick = {
    label: "wick",
    data: h.map((v, i) => [l[i], v]),
    backgroundColor: up.map(u => hexToRgba(u ? GRN : RED, .9)),
    barPercentage: .16, categoryPercentage: 1, grouped: false, borderWidth: 0, borderRadius: 2, order: 2,
  };
  const body = {
    label: d.label || "OHLC",
    data: o.map((v, i) => {
      const a = v, b = c[i];
      if (a === b) { const e = Math.abs(a) * 0.0006 || 0.01; return [a - e, b + e]; }
      return [Math.min(a, b), Math.max(a, b)];
    }),
    backgroundColor: up.map(u => hexToRgba(u ? GRN : RED, .95)),
    barPercentage: .62, categoryPercentage: 1, grouped: false, borderWidth: 0, borderRadius: 2.5, order: 1,
  };

  return new Chart(canvas, {
    type: "bar",
    data: { labels: spec.labels, datasets: [body, wick] },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 550, easing: "easeOutQuart" },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: baseTooltip(false, {
          title: items => (items[0] ? String(spec.labels[items[0].dataIndex]) : ""),
          label: () => "",
          afterBody: items => {
            if (!items.length) return [];
            const i = items[0].dataIndex;
            return [
              `Open   ${fmtNum(o[i])}`,
              `High   ${fmtNum(h[i])}`,
              `Low    ${fmtNum(l[i])}`,
              `Close  ${fmtNum(c[i])}`,
              `Change ${o[i] ? (((c[i] - o[i]) / Math.abs(o[i])) * 100).toFixed(2) + "%" : ""}`,
            ];
          },
        }),
      },
      scales: baseScales(false),
    },
  });
}

/* =====================================================================
   LOGIN  (POST /user-service/user/login, headers api-version + lang)
===================================================================== */
async function doLogin() {
  const btn = $("loginBtn"), err = $("loginErr");
  err.style.display = "none";
  const email = $("inEmail").value.trim();
  const pass = $("inPass").value;
  if (!email || !pass) { err.textContent = "Enter an email and a password."; err.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Signing in\u2026";
  try {
    const res = await fetch(USER_API + "/user/login", {
      method: "POST",
      headers: {
        "accept": "application/json",
        "api-version": "v1",
        "x-custom-lang": "en",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        password: pass,
        deviceToken: "zenith-web-chat",
        email: email,
        mobile_number: "string",
      }),
    });
    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = j.message || j.detail || ""; } catch (_) {}
      throw new Error(detail || `Login failed (${res.status}) — check the email/password combination.`);
    }
    const data = await res.json();
    TOKEN = data.accessToken;
    if (!TOKEN) throw new Error("Login succeeded but no accessToken was returned.");
    USER = data.user || {};
    enterApp(email);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function enterApp(email) {
  const name = USER.first_name || USER.username || (email.split("@")[0]) || "user";
  $("sbUserName").textContent = name;
  $("sbUserEmail").textContent = USER.email || email;
  $("avatarTxt").textContent = (name[0] || "?").toUpperCase();
  $("loginView").style.display = "none";
  $("appView").classList.add("on");
  if (window.innerWidth <= 880) $("sidebar").classList.add("hidden");
  showWelcome();
  loadThreads();
  $("chatIn").focus();
}

function logout() { location.reload(); }

/* =====================================================================
   ZENITH API helpers
===================================================================== */
async function zPost(path, body, opts = {}) {
  const res = await fetch(zenithBase() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
    body: JSON.stringify(body),
    keepalive: !!opts.keepalive,
  });
  if (res.status === 401) { toast("Session expired — please sign in again.", "err"); setTimeout(() => location.reload(), 1400); throw new Error("401"); }
  return res;
}
async function zGet(path) {
  const res = await fetch(zenithBase() + path, { headers: { "Authorization": "Bearer " + TOKEN } });
  if (res.status === 401) { toast("Session expired — please sign in again.", "err"); setTimeout(() => location.reload(), 1400); throw new Error("401"); }
  return res;
}

/* =====================================================================
   SIDEBAR — GET /old_chats
===================================================================== */
async function loadThreads(manual) {
  const btn = $("sbRefreshBtn");
  btn.classList.add("spin");
  if (!THREADS.length) {
    $("threadList").innerHTML = '<div class="skel"></div>'.repeat(6);
  }
  try {
    const res = await zGet("/old_chats");
    if (!res.ok) throw new Error("old_chats " + res.status);
    const data = await res.json();
    THREADS = (data.old_chats || []).slice().sort((a, b) =>
      new Date(b.modified_on || b.created_on || 0) - new Date(a.modified_on || a.created_on || 0));
    renderThreadList();
    if (manual) toast("Conversations refreshed", "ok");
  } catch (e) {
    $("threadList").innerHTML = "";
    if (String(e.message) !== "401") toast("Could not load conversations: " + e.message, "err");
  } finally {
    btn.classList.remove("spin");
  }
}

function renderThreadList() {
  const list = $("threadList");
  if (!THREADS.length) {
    list.innerHTML = `<div class="sbEmpty">No conversations yet.<br>Start one and it will appear here.</div>`;
    return;
  }
  list.innerHTML = THREADS.map((t, i) => `
    <div class="threadItem ${t.thread_id === THREAD_ID ? "active" : ""}" data-tid="${escapeHtml(t.thread_id)}"
         style="animation-delay:${Math.min(i * 28, 400)}ms" onclick="openThread(this.dataset.tid)">
      <div class="tt">${escapeHtml(t.chat_title || "New conversation")}</div>
      <div class="td">${relTime(t.modified_on || t.created_on)}</div>
    </div>`).join("");
}

function upsertThreadLocal(threadId, title) {
  const now = new Date().toISOString();
  const existing = THREADS.find(t => t.thread_id === threadId);
  if (existing) {
    if (title) existing.chat_title = title;
    existing.modified_on = now;
  } else {
    THREADS.unshift({ thread_id: threadId, chat_title: title || "", created_on: now, modified_on: now });
  }
  THREADS.sort((a, b) => new Date(b.modified_on || 0) - new Date(a.modified_on || 0));
  renderThreadList();
}

/* =====================================================================
   FEED helpers
===================================================================== */
const feed = () => $("feed");
const scroller = () => $("scroller");
let stickToBottom = true;

function scrollDown(force) {
  if (force) stickToBottom = true;
  if (force || stickToBottom) scroller().scrollTop = scroller().scrollHeight;
}

function clearFeed() {
  // destroy chart instances belonging to the old feed
  for (const [id, reg] of CHART_REGISTRY) { if (reg.chart) reg.chart.destroy(); CHART_REGISTRY.delete(id); }
  feed().innerHTML = "";
  setChips([]);
}

function showWelcome() {
  clearFeed();
  const w = document.createElement("div");
  w.id = "welcome";
  w.innerHTML = `
    <div class="wMark">Z</div>
    <h2>Ask <em>Zenith</em> anything about the markets</h2>
    <p>Live quotes, company research, market news, portfolio questions and more &mdash;
      answered with real data fetched at the moment you ask.</p>
    <div class="starterGrid">${starterCards()}</div>`;
  feed().appendChild(w);
  $("headTitle").textContent = "New conversation";
  setBusy(false, "Ready");
}

function starterCards() {
  return STARTERS.map(s => `
    <button class="starter" data-q="${escapeHtml(s.q)}" onclick="askStarter(this)">
      <div class="st">${ICONS.spark}${escapeHtml(s.t)}</div>
      <div class="ss">${escapeHtml(s.s)}</div>
    </button>`).join("");
}
function askStarter(el) { $("chatIn").value = el.dataset.q; sendMsg(); }

function removeWelcome() {
  const w = document.getElementById("welcome");
  if (w) w.remove();
}

function addUserTurn(text) {
  const d = document.createElement("div");
  d.className = "turn user";
  d.innerHTML = `<div class="mAvatar">${escapeHtml(($("avatarTxt").textContent || "U"))}</div>
    <div class="bubbleWrap"><div class="bubble">${escapeHtml(text)}</div></div>`;
  feed().appendChild(d);
  scrollDown(true);
}

function addBotTurn() {
  const d = document.createElement("div");
  d.className = "turn bot";
  d.innerHTML = `<div class="mAvatar">Z</div>
    <div class="bubbleWrap">
      <button class="copyMsg" onclick="copyBotMsg(this)">${ICONS.copy}<span>Copy</span></button>
      <div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>
    </div>`;
  feed().appendChild(d);
  return { wrap: d.querySelector(".bubbleWrap"), bubble: d.querySelector(".bubble"), raw: "" };
}

function copyBotMsg(btn) {
  const bubble = btn.parentElement.querySelector(".bubble");
  copyText(bubble ? bubble.innerText : "", btn);
}

function addStatusRow(text) {
  const d = document.createElement("div");
  d.className = "statusRow";
  d.innerHTML = `<div class="mAvatar" style="visibility:hidden"></div>
    <div class="statusPill"><span class="orbit"></span><span class="txt">${escapeHtml(text)}</span></div>`;
  feed().appendChild(d);
  scrollDown();
  return d;
}

function addNote(text, kind) {
  const d = document.createElement("div");
  d.className = "sysNote" + (kind ? " " + kind : "");
  d.textContent = text;
  feed().appendChild(d);
  scrollDown();
}

function setChips(list) {
  const row = $("chipsRow");
  row.innerHTML = (list || []).map((q, i) =>
    `<button class="chip" style="animation-delay:${i * 90}ms" data-q="${escapeHtml(q)}"
       onclick="askChip(this)">${ICONS.ask}<span>${escapeHtml(q)}</span></button>`).join("");
}
function askChip(el) { $("chatIn").value = el.dataset.q; sendMsg(); }

function setBusy(busy, txt) {
  $("headDot").classList.toggle("busy", !!busy);
  $("headSubTxt").textContent = txt || (busy ? "Thinking\u2026" : "Ready");
  $("sendBtn").disabled = !!busy;
}

/* =====================================================================
   CHAT LIFECYCLE
===================================================================== */
async function endActiveThread(keepalive) {
  if (!THREAD_ID) return;
  const tid = THREAD_ID;
  THREAD_ID = null;
  try { await zPost("/end_chat", { thread_id: tid }, { keepalive: !!keepalive }); }
  catch (_) { /* best effort — history is persisted turn by turn anyway */ }
}

async function newChat() {
  if (SENDING) { toast("Wait for the current answer to finish.", "err"); return; }
  await endActiveThread();
  THREAD_TITLED = false;
  FIRST_QUESTION = "";
  showWelcome();
  renderThreadList();
  if (window.innerWidth <= 880) $("sidebar").classList.add("hidden");
  $("chatIn").focus();
}

async function openThread(threadId) {
  if (SENDING) { toast("Wait for the current answer to finish.", "err"); return; }
  if (threadId === THREAD_ID) return;
  await endActiveThread();

  clearFeed();
  const st = addStatusRow("Loading conversation\u2026");
  setBusy(true, "Loading conversation\u2026");
  try {
    const res = await zPost("/initiate_chat", { thread_id: threadId });
    if (!res.ok) throw new Error("initiate_chat " + res.status);
    const data = await res.json();
    THREAD_ID = data.thread_id;
    THREAD_TITLED = true;
    FIRST_QUESTION = "";
    st.remove();
    renderHistory(data.history || []);
    const meta = THREADS.find(t => t.thread_id === threadId);
    $("headTitle").textContent = (meta && meta.chat_title) || "Conversation";
    renderThreadList();
    setBusy(false, "Ready");
    if (window.innerWidth <= 880) $("sidebar").classList.add("hidden");
    scrollDown(true);
  } catch (e) {
    st.remove();
    setBusy(false, "Ready");
    if (String(e.message) !== "401") {
      addNote("Could not open this conversation: " + e.message, "err");
      toast("Could not open conversation", "err");
    }
  }
}

function renderHistory(history) {
  if (!history.length) {
    addNote("This conversation has no messages yet — say hello.");
    return;
  }
  for (const m of history) {
    const type = m.type || m.role || "";
    const content = typeof m.content === "string" ? m.content : "";
    if (!content) continue;
    if (type === "UserMessage" || type === "user") {
      addUserTurn(content);
    } else if (type === "AssistantMessage" || type === "assistant") {
      const bot = addBotTurn();
      bot.bubble.innerHTML = renderMarkdown(content);
      const charts = (m.metadata && Array.isArray(m.metadata.charts)) ? m.metadata.charts : [];
      for (const spec of charts) renderChartCard(spec, bot.wrap);
    }
  }
}

/* =====================================================================
   SEND + STREAM
   Chunk protocol (one JSON object per newline):
     {chunk_type:"status", status, status_message}   -> live status pill
     {chunk_type:"text",   response}                 -> markdown text
     {chunk_type:"chart",  chart:{...}}              -> chart card
     {chunk_type:"suggestions", suggested_questions} -> chips (in-stream —
                                the standalone endpoint is NEVER called)
     {chunk_type:"done",   stream_completed:true}    -> end of turn
===================================================================== */
async function sendMsg() {
  if (SENDING) return;
  const inp = $("chatIn");
  const q = inp.value.trim();
  if (!q) return;

  SENDING = true;
  setBusy(true, "Sending\u2026");
  inp.value = ""; autoGrow(inp);
  setChips([]);
  removeWelcome();

  // Lazy thread creation: a brand-new chat gets its thread on first send.
  if (!THREAD_ID) {
    const st0 = addStatusRow("Starting a new conversation\u2026");
    try {
      const res = await zPost("/initiate_chat", { thread_id: "" });
      if (!res.ok) throw new Error("initiate_chat " + res.status);
      const data = await res.json();
      THREAD_ID = data.thread_id;
      THREAD_TITLED = false;
      FIRST_QUESTION = q;
      upsertThreadLocal(THREAD_ID, "");
      st0.remove();
    } catch (e) {
      st0.remove();
      SENDING = false; setBusy(false, "Ready");
      if (String(e.message) !== "401") {
        addNote("Could not start a conversation: " + e.message, "err");
        toast("Could not start a conversation", "err");
      }
      return;
    }
  }

  addUserTurn(q);
  const st = addStatusRow("Connecting to Zenith\u2026");
  let bot = null, botText = "", gotChips = false, billingDenied = false;

  try {
    const res = await fetch(zenithBase() + "/stream_chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
      body: JSON.stringify({ user_input: q, thread_id: THREAD_ID, session_id: SESSION_ID }),
    });
    if (res.status === 401) { toast("Session expired — sign in again.", "err"); setTimeout(() => location.reload(), 1400); throw new Error("401"); }
    if (!res.ok || !res.body) throw new Error("stream_chat " + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    const ensureBot = () => {
      if (!bot) { if (st.parentNode) st.remove(); bot = addBotTurn(); }
      return bot;
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        let c; try { c = JSON.parse(line); } catch (_) { continue; }

        const type = c.chunk_type || "text";

        if (type === "status") {
          if (c.status === "billing_denied") billingDenied = true;
          if (c.status_message && st.parentNode) {
            st.querySelector(".txt").textContent = humanStatus(c.status_message);
            setBusy(true, humanStatus(c.status_message));
          }
        } else if (type === "suggestions" && Array.isArray(c.suggested_questions) && c.suggested_questions.length) {
          gotChips = true;
          setChips(c.suggested_questions.slice(0, 4));
        } else if (type === "chart" && c.chart) {
          const b = ensureBot();
          renderChartCard(c.chart, b.wrap);
          scrollDown();
        } else if (c.response) {
          const b = ensureBot();
          botText += c.response;
          b.bubble.innerHTML = renderMarkdown(botText) + '<span class="cursor"></span>';
          scrollDown();
        }

        if (c.stream_completed) { if (st.parentNode) st.remove(); }
      }
    }

    if (st.parentNode) st.remove();
    if (bot) {
      bot.bubble.innerHTML = renderMarkdown(botText); // final render, drop cursor
    } else if (!billingDenied) {
      addNote("Zenith returned no answer for this message.", "warn");
    }
    if (billingDenied) addNote("You are out of credits — top up to keep chatting.", "warn");

    upsertThreadLocal(THREAD_ID, null);
    maybeTitleThread();
  } catch (e) {
    if (st.parentNode) st.remove();
    if (String(e.message) !== "401") addNote("Something went wrong: " + e.message, "err");
  } finally {
    SENDING = false;
    setBusy(false, "Ready");
    $("chatIn").focus();
    scrollDown();
  }
}

function humanStatus(msg) {
  const m = String(msg);
  if (m.startsWith("insufficient_credits")) return "Out of credits";
  return m;
}

/* First completed exchange of a new thread -> /chat_title names it. */
async function maybeTitleThread() {
  if (THREAD_TITLED || !THREAD_ID || !FIRST_QUESTION) return;
  THREAD_TITLED = true;
  try {
    const res = await zPost("/chat_title", {
      user_input: FIRST_QUESTION, thread_id: THREAD_ID, session_id: SESSION_ID,
    });
    if (!res.ok) throw new Error("chat_title " + res.status);
    const data = await res.json();
    if (data.chat_title) {
      $("headTitle").textContent = data.chat_title;
      upsertThreadLocal(THREAD_ID, data.chat_title);
    }
  } catch (_) { /* a missing title never blocks the chat */ }
}

/* =====================================================================
   PAGE LIFECYCLE — end the active chat when the tab closes.
===================================================================== */
window.addEventListener("pagehide", () => {
  if (TOKEN && THREAD_ID) {
    try {
      fetch(zenithBase() + "/end_chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
        body: JSON.stringify({ thread_id: THREAD_ID }),
        keepalive: true,
      });
    } catch (_) {}
  }
});

/* =====================================================================
   DYNAMIC BACKGROUND — flowing wave ribbons + drifting particles on a
   full-screen canvas behind the glass panels. Cheap on the GPU: a few
   hundred line segments per frame, paused whenever the tab is hidden.
===================================================================== */
function startWaves() {
  const canvas = $("waves");
  if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, t = 0, running = true;

  const RIBBONS = [
    { yFactor: .78, amp: 46, wl: .0042, speed: .012, color: "79,140,255",  alpha: .16, width: 1.6, layers: 5, gap: 13 },
    { yFactor: .86, amp: 34, wl: .0058, speed: .017, color: "139,92,246", alpha: .13, width: 1.4, layers: 4, gap: 11 },
    { yFactor: .22, amp: 28, wl: .0036, speed: .009, color: "34,211,238", alpha: .08, width: 1.2, layers: 3, gap: 15 },
  ];
  const PARTICLES = Array.from({ length: 46 }, () => ({
    x: Math.random(), y: Math.random(),
    r: .6 + Math.random() * 1.7,
    vx: (Math.random() - .5) * .00016, vy: -(.00004 + Math.random() * .00013),
    a: .12 + Math.random() * .3, tw: Math.random() * Math.PI * 2,
  }));

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(innerWidth * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
  }
  resize();
  window.addEventListener("resize", resize);

  function ribbon(r) {
    const baseY = H * r.yFactor;
    for (let l = 0; l < r.layers; l++) {
      ctx.beginPath();
      const phase = t * r.speed + l * .55;
      const amp = (r.amp + l * 6) * dpr;
      for (let x = 0; x <= W; x += 7 * dpr) {
        const y = baseY
          + Math.sin(x * r.wl / dpr + phase) * amp
          + Math.sin(x * r.wl * 2.15 / dpr - phase * .7) * amp * .32
          + l * r.gap * dpr;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${r.color},${(r.alpha * (1 - l / (r.layers + 1))).toFixed(3)})`;
      ctx.lineWidth = r.width * dpr;
      ctx.stroke();
    }
  }

  function frame() {
    if (!running) return;
    t += 1;
    ctx.clearRect(0, 0, W, H);
    for (const r of RIBBONS) ribbon(r);
    for (const p of PARTICLES) {
      p.x += p.vx; p.y += p.vy; p.tw += .02;
      if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      if (p.x < -.02) p.x = 1.02; else if (p.x > 1.02) p.x = -.02;
      const glow = p.a * (0.65 + 0.35 * Math.sin(p.tw));
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r * dpr, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(140,175,255,${glow.toFixed(3)})`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener("visibilitychange", () => {
    const wasRunning = running;
    running = !document.hidden;
    if (running && !wasRunning) requestAnimationFrame(frame);
  });
}

/* =====================================================================
   BOOT
===================================================================== */
(function boot() {
  setEnv(ENV);
  $("demoMails").innerHTML = DEMO_EMAILS.map(m =>
    `<span class="demoMail" onclick="document.getElementById('inEmail').value=this.textContent">${m}</span>`).join("");
  const sc = $("scroller");
  sc.addEventListener("scroll", () => {
    stickToBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 90;
    $("jumpDown").classList.toggle("show", !stickToBottom);
  });
  startWaves();
})();
</script>
