services:
  - type: web
    name: dmit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── Database (Neon PostgreSQL) ─────────────────────────────────────
      - key: DATABASE_URL
        sync: false       # Neon → Connection Details → Pooled connection string

      # ── File storage (Backblaze B2 or Cloudflare R2 — S3-compatible) ──
      # For Backblaze B2 (no card required):
      #   STORAGE_ENDPOINT = https://s3.us-west-004.backblazeb2.com
      #   R2_ACCESS_KEY    = B2 keyID
      #   R2_SECRET_KEY    = B2 applicationKey
      #   R2_BUCKET        = your-bucket-name
      # For Cloudflare R2 (requires card):
      #   CF_ACCOUNT_ID    = Cloudflare Account ID
      #   (STORAGE_ENDPOINT is auto-built from CF_ACCOUNT_ID if not set)
      - key: STORAGE_ENDPOINT
        sync: false       # B2: https://s3.us-west-004.backblazeb2.com
      - key: CF_ACCOUNT_ID
        sync: false       # Only needed for Cloudflare R2 (leave blank for B2)
      - key: R2_ACCESS_KEY
        sync: false       # B2 keyID  /  R2 Access Key ID
      - key: R2_SECRET_KEY
        sync: false       # B2 applicationKey  /  R2 Secret Key
      - key: R2_BUCKET
        value: DMITobjects
      - key: R2_PUBLIC_URL
        sync: false       # Leave blank for private buckets (presigned URLs used)

      # ── Auth ───────────────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        value: admin@dmit.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false       # python -c "import secrets; print(secrets.token_hex(32))"

      # ── AI providers ───────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_EMBED_KEY
        sync: false

      # ── CORS — add Vercel URL after frontend deploy ────────────────────
      - key: CORS_ORIGINS
        sync: false       # https://your-app.vercel.app

      # ── Performance ────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: PYTHONOPTIMIZE
        value: "1"
