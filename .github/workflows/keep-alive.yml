name: Keep backends awake

# Render free instances sleep after ~15 min of inactivity; cold starts take
# 30-60 s. This pings BOTH services every 10 minutes so they stay warm.
#
# Required GitHub repository secrets:
#   RENDER_BACKEND_URL — main API,       e.g. https://dmit-api.onrender.com
#   WORKER_BACKEND_URL — analysis worker, e.g. https://dmit-worker.onrender.com
#
# The two services live on two separate Render accounts, so each gets its
# own 750 free instance-hours/month — enough for both to stay on 24/7.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, 24 × 7
  workflow_dispatch: {}       # manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping both backends
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping main API
        env:
          MAIN_RAW: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          MAIN_URL="${MAIN_RAW:-https://brain-dmit-analysis.onrender.com}"
          MAIN_URL="${MAIN_URL%/}"
          echo "Pinging Main API at: ${MAIN_URL}/api/health"
          curl -sS -f \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "DMIT-KeepAlive-Cron/1.0" \
            "${MAIN_URL}/api/health"
          echo -e "\nMain API ping successful at $(date -u)"

      - name: Ping analysis worker
        if: always()
        env:
          WORKER_RAW: ${{ secrets.WORKER_BACKEND_URL }}
        run: |
          WORKER_URL="${WORKER_RAW:-https://brain-dmit-analysis-tdyv.onrender.com}"
          WORKER_URL="${WORKER_URL%/}"
          echo "Pinging Worker API at: ${WORKER_URL}/health"
          curl -sS -f \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -A "DMIT-KeepAlive-Cron/1.0" \
            "${WORKER_URL}/health"
          echo -e "\nWorker API ping successful at $(date -u)"
