name: Keep Render backend awake

# Render's free/starter tier spins the service down after ~15 minutes of
# inactivity. A cold start for this project (OpenCV + NumPy + SciPy + ML libs)
# takes 30–60 seconds, making the first request feel broken.
#
# This workflow pings /api/health every 10 minutes so the instance never
# idles long enough to sleep.
#
# Setup:
#   1. Deploy the backend on Render and note the service URL.
#   2. Add a GitHub repository secret named RENDER_BACKEND_URL with the value
#      e.g.  https://dmit-api.onrender.com
#   3. Push this file to the default branch — the schedule starts automatically.
#
# The workflow also accepts manual triggers (workflow_dispatch) so you can
# test it from the GitHub Actions tab without waiting for the cron.

on:
  # DISABLED: schedule:
  #   - cron: "*/10 * * * *"   # every 10 minutes, 24 × 7
  workflow_dispatch: {}       # manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Wake up Render backend
        run: |
          # --retry covers the case where the ping itself wakes a sleeping
          # instance (first attempt can time out while Render boots it up).
          curl --silent --show-error --fail \
            --max-time 60 \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            "${{ secrets.RENDER_BACKEND_URL }}/api/health"
